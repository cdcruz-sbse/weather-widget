<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Weather Widget</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            color: white;
            margin: 0;
        }

        .glass {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .weather-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
            border-radius: 1.5rem;
        }

        #bg-blob {
            position: absolute;
            width: 120%;
            height: 120%;
            background: radial-gradient(circle at center, rgba(56, 189, 248, 0.1) 0%, transparent 70%);
            animation: drift 25s linear infinite alternate;
        }

        @keyframes drift {
            from { transform: translate(-10%, -10%) rotate(0deg); }
            to { transform: translate(10%, 10%) rotate(180deg); }
        }

        .loader {
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            border-top: 3px solid #38bdf8;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .custom-scroll::-webkit-scrollbar {
            width: 4px;
        }
        .custom-scroll::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scroll::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }
    </style>
</head>
<body>

    <div id="widget" class="relative glass rounded-3xl w-full max-w-4xl transition-all duration-700 opacity-0 transform translate-y-8 overflow-hidden">
        <div class="weather-bg">
            <div id="bg-blob"></div>
        </div>

        <div class="flex flex-col md:flex-row h-full">
            <div class="w-full md:w-5/12 p-6 md:p-10 border-b md:border-b-0 md:border-r border-white/10 bg-white/5">
                <div class="flex justify-between items-start mb-8 md:mb-12">
                    <div>
                        <h1 id="city" class="text-2xl md:text-3xl font-bold tracking-tight truncate max-w-[200px] md:max-w-full">Locating...</h1>
                        <p id="date" class="text-sm text-slate-400 mt-1"></p>
                    </div>
                    <button onclick="refreshWeather()" class="p-2 hover:bg-white/10 rounded-full transition-all active:scale-95">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"></path><path d="M21 3v5h-5"></path><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"></path><path d="M8 16H3v5"></path></svg>
                    </button>
                </div>

                <div id="loading-state" class="flex flex-col items-center justify-center py-20">
                    <div class="loader mb-4"></div>
                    <p class="text-slate-400 animate-pulse text-sm">Syncing weather...</p>
                </div>

                <div id="current-weather" class="hidden">
                    <div class="flex flex-row md:flex-col items-center md:items-start justify-between md:justify-start gap-4">
                        <div id="current-icon" class="w-24 h-24 md:w-32 md:h-32 mb-4 drop-shadow-2xl"></div>
                        <div>
                            <span id="temp" class="text-6xl md:text-8xl font-light tracking-tighter">--°</span>
                            <p id="condition-text" class="text-xl text-slate-300 capitalize mt-2 font-medium">--</p>
                        </div>
                    </div>

                    <div class="grid grid-cols-3 gap-3 mt-10">
                        <div class="bg-black/20 rounded-2xl p-3 text-center">
                            <p class="text-[10px] uppercase text-slate-500 mb-1">Wind</p>
                            <p id="wind" class="text-sm font-semibold">--</p>
                        </div>
                        <div class="bg-black/20 rounded-2xl p-3 text-center">
                            <p class="text-[10px] uppercase text-slate-500 mb-1">Humidity</p>
                            <p id="humidity" class="text-sm font-semibold">--</p>
                        </div>
                        <div class="bg-black/20 rounded-2xl p-3 text-center">
                            <p class="text-[10px] uppercase text-slate-500 mb-1">UV</p>
                            <p id="uv" class="text-sm font-semibold">--</p>
                        </div>
                    </div>
                </div>
            </div>

            <div class="w-full md:w-7/12 p-6 md:p-10 flex flex-col">
                <h3 class="text-xs font-bold text-slate-500 uppercase tracking-widest mb-6">Extended Forecast</h3>
                <div id="forecast-container" class="space-y-2 md:space-y-4 overflow-y-auto custom-scroll max-h-[400px] md:max-h-full pr-1"></div>
                <div id="error-state" class="hidden text-center py-12">
                    <p class="text-red-400 mb-4">Connection error. Please check your signal.</p>
                    <button onclick="refreshWeather()" class="px-6 py-2 bg-sky-500/20 text-sky-400 border border-sky-500/30 rounded-xl hover:bg-sky-500/30 transition-all">Retry</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const weatherIcons = {
            0: '<svg viewBox="0 0 24 24" fill="none" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-full h-full"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>',
            1: '<svg viewBox="0 0 24 24" fill="none" stroke="#fcd34d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-full h-full"><path d="M12 2v2"></path><path d="m4.93 4.93 1.41 1.41"></path><path d="M20 12h2"></path><path d="m19.07 4.93-1.41 1.41"></path><path d="M15.947 12.65a4 4 0 0 0-5.925-4.128"></path><path d="M13 22H7a5 5 0 1 1 4.9-6H13a3 3 0 0 1 0 6Z"></path></svg>',
            2: '<svg viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-full h-full"><path d="M12 2v2"></path><path d="M20 16.58A5 5 0 0 0 18 7h-1.26A8 8 0 1 0 4 15.25"></path><path d="M8 16a3 3 0 1 0 0 6h10a3 3 0 1 0 0-6Z"></path></svg>',
            3: '<svg viewBox="0 0 24 24" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-full h-full"><path d="M20 16.58A5 5 0 0 0 18 7h-1.26A8 8 0 1 0 4 15.25"></path><path d="M8 16a3 3 0 1 0 0 6h10a3 3 0 1 0 0-6Z"></path></svg>',
            61: '<svg viewBox="0 0 24 24" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-full h-full"><path d="M16 13v8"></path><path d="M8 13v8"></path><path d="M12 15v8"></path><path d="M20 16.58A5 5 0 0 0 18 7h-1.26A8 8 0 1 0 4 15.25"></path></svg>',
            95: '<svg viewBox="0 0 24 24" fill="none" stroke="#facc15" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-full h-full"><path d="M13 2l-2 8h6l-8 12"></path></svg>',
        };

        const WMO_CODES = {
            0: 'Clear Sky', 1: 'Mainly Clear', 2: 'Partly Cloudy', 3: 'Overcast',
            45: 'Foggy', 51: 'Light Drizzle', 61: 'Rainy', 71: 'Snowy',
            80: 'Rain Showers', 95: 'Thunderstorm'
        };

        function getIcon(code) {
            if (weatherIcons[code]) return weatherIcons[code];
            if (code >= 51 && code <= 67) return weatherIcons[61];
            if (code >= 80 && code <= 82) return weatherIcons[61];
            return weatherIcons[2];
        }

        async function fetchWeather(lat, lon, cityName = "Your Location") {
            const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m&daily=weather_code,temperature_2m_max,temperature_2m_min,uv_index_max&timezone=auto`;
            
            try {
                const response = await fetch(url);
                const data = await response.json();
                updateUI(data, cityName);
            } catch (error) {
                console.error("API Error:", error);
                document.getElementById('loading-state').classList.add('hidden');
                document.getElementById('error-state').classList.remove('hidden');
            }
        }

        function updateUI(data, cityName) {
            const current = data.current;
            const daily = data.daily;
            
            document.getElementById('city').textContent = cityName;
            
            document.getElementById('temp').textContent = `${Math.round(current.temperature_2m)}°`;
            document.getElementById('condition-text').textContent = WMO_CODES[current.weather_code] || "Clear Sky";
            document.getElementById('current-icon').innerHTML = getIcon(current.weather_code);
            document.getElementById('humidity').textContent = `${current.relative_humidity_2m}%`;
            document.getElementById('wind').textContent = `${Math.round(current.wind_speed_10m)} km/h`;
            document.getElementById('uv').textContent = daily.uv_index_max ? Math.round(daily.uv_index_max[0]) : "0";

            const forecastContainer = document.getElementById('forecast-container');
            forecastContainer.innerHTML = '';

            const todayStr = new Date().toDateString();

            for (let i = 0; i < daily.time.length; i++) {
                const forecastDate = new Date(daily.time[i] + 'T00:00:00');
                if (forecastDate.toDateString() === todayStr) continue;

                const dayName = forecastDate.toLocaleDateString('en-US', { weekday: 'long' });
                const icon = getIcon(daily.weather_code[i]);
                const max = Math.round(daily.temperature_2m_max[i]);
                const min = Math.round(daily.temperature_2m_min[i]);

                const item = document.createElement('div');
                item.className = 'group flex items-center justify-between p-4 rounded-2xl bg-white/0 hover:bg-white/5 border border-transparent hover:border-white/10 transition-all cursor-default';
                item.innerHTML = `
                    <div class="flex items-center gap-4 w-1/3">
                        <div class="w-8 h-8 opacity-70 group-hover:opacity-100 transition-opacity">${icon}</div>
                        <span class="font-medium text-sm md:text-base text-slate-200">${dayName}</span>
                    </div>
                    <span class="text-xs text-slate-500 hidden sm:block w-1/3 text-center capitalize">${WMO_CODES[daily.weather_code[i]] || 'Clear'}</span>
                    <div class="flex items-center justify-end gap-4 w-1/3">
                        <span class="font-bold text-sm md:text-base">${max}°</span>
                        <span class="text-slate-500 text-xs md:text-sm">${min}°</span>
                    </div>
                `;
                forecastContainer.appendChild(item);
                if (forecastContainer.children.length >= 7) break;
            }

            document.getElementById('loading-state').classList.add('hidden');
            document.getElementById('current-weather').classList.remove('hidden');
            document.getElementById('widget').classList.remove('opacity-0', 'translate-y-8');
        }

        async function reverseGeocode(lat, lon) {
            try {
                const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}`, {
                    headers: { 'Accept-Language': 'en' }
                });
                const data = await res.json();
                return data.address.city || data.address.town || data.address.village || data.address.suburb || "Nearby";
            } catch { return "Your Location"; }
        }

        function refreshWeather() {
            const widget = document.getElementById('widget');
            widget.classList.add('opacity-0', 'translate-y-4');
            setTimeout(init, 400);
        }

        function setInitialDate() {
            const now = new Date();
            const dateStr = now.toLocaleDateString('en-US', { weekday: 'long', month: 'short', day: 'numeric' });
            const dateEl = document.getElementById('date');
            if (dateEl) dateEl.textContent = dateStr;
        }

        function init() {
            setInitialDate();
            
            document.getElementById('loading-state').classList.remove('hidden');
            document.getElementById('current-weather').classList.add('hidden');
            document.getElementById('error-state').classList.add('hidden');
            document.getElementById('city').textContent = "Locating...";
            
            if ("geolocation" in navigator) {
                navigator.geolocation.getCurrentPosition(
                    async (pos) => {
                        const city = await reverseGeocode(pos.coords.latitude, pos.coords.longitude);
                        fetchWeather(pos.coords.latitude, pos.coords.longitude, city);
                    },
                    (err) => {
                        console.warn("Geolocation failed, using default location.");
                        fetchWeather(40.71, -74.01, "New York");
                    },
                    { timeout: 10000 }
                );
            } else {
                fetchWeather(40.71, -74.01, "New York");
            }
        }

        window.onload = init;
    </script>
</body>
</html>
