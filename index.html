<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compact Horizontal Weather Widget</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            color: white;
            margin: 0;
        }

        .glass {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.6);
        }

        .weather-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
            border-radius: 1.25rem;
        }

        #bg-blob {
            position: absolute;
            width: 140%;
            height: 140%;
            background: radial-gradient(circle at center, rgba(56, 189, 248, 0.08) 0%, transparent 70%);
            animation: drift 30s linear infinite alternate;
        }

        @keyframes drift {
            from { transform: translate(-20%, -20%) rotate(0deg); }
            to { transform: translate(10%, 10%) rotate(180deg); }
        }

        .loader {
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            border-top: 2px solid #38bdf8;
            width: 32px;
            height: 32px;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .custom-scroll::-webkit-scrollbar {
            height: 4px;
        }
        .custom-scroll::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scroll::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }
        
        /* Hide scrollbar by default, show on hover */
        .custom-scroll {
            scrollbar-width: thin;
            scrollbar-color: rgba(255, 255, 255, 0.1) transparent;
        }
    </style>
</head>
<body>

    <div id="widget" class="relative glass rounded-[2rem] w-full max-w-5xl transition-all duration-700 opacity-0 transform translate-y-4 overflow-hidden">
        <div class="weather-bg">
            <div id="bg-blob"></div>
        </div>

        <div class="flex flex-col lg:flex-row">
            <!-- Main Content Area -->
            <div class="flex-1 p-6 md:p-8 flex flex-col sm:flex-row lg:flex-col items-center sm:items-start lg:items-center justify-between gap-6 border-b lg:border-b-0 lg:border-r border-white/5 bg-white/5">
                
                <div class="flex flex-col items-center sm:items-start lg:items-center text-center sm:text-left lg:text-center w-full sm:w-auto lg:w-full">
                    <div class="flex items-center justify-between w-full mb-4 sm:mb-2 lg:mb-4">
                        <div class="flex flex-col items-center sm:items-start lg:items-center">
                            <h1 id="city" class="text-xl font-bold tracking-tight truncate max-w-[180px]">Locating...</h1>
                            <p id="date" class="text-xs text-slate-400 font-medium"></p>
                        </div>
                        <button onclick="refreshWeather()" class="p-2 hover:bg-white/10 rounded-full transition-all active:scale-90">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"></path><path d="M21 3v5h-5"></path><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"></path><path d="M8 16H3v5"></path></svg>
                        </button>
                    </div>

                    <div id="loading-state" class="py-10">
                        <div class="loader"></div>
                    </div>

                    <div id="current-weather" class="hidden flex flex-col items-center sm:items-start lg:items-center">
                        <div class="flex items-center gap-4">
                            <div id="current-icon" class="w-16 h-16 md:w-20 md:h-20 drop-shadow-xl"></div>
                            <span id="temp" class="text-5xl md:text-6xl font-light tracking-tighter">--°</span>
                        </div>
                        <p id="condition-text" class="text-sm font-medium text-slate-300 mt-2 uppercase tracking-widest">--</p>
                    </div>
                </div>

                <!-- Horizontal Stats Strip -->
                <div id="stats-strip" class="hidden flex flex-row lg:flex-row gap-4 sm:gap-6 lg:gap-4 w-full sm:w-auto lg:w-full justify-center">
                    <div class="text-center">
                        <p class="text-[9px] uppercase text-slate-500 font-bold mb-0.5">Wind</p>
                        <p id="wind" class="text-xs font-semibold">--</p>
                    </div>
                    <div class="text-center px-4 border-x border-white/10">
                        <p class="text-[9px] uppercase text-slate-500 font-bold mb-0.5">Humid</p>
                        <p id="humidity" class="text-xs font-semibold">--</p>
                    </div>
                    <div class="text-center">
                        <p class="text-[9px] uppercase text-slate-500 font-bold mb-0.5">UV Index</p>
                        <p id="uv" class="text-xs font-semibold">--</p>
                    </div>
                </div>
            </div>

            <!-- Forecast Strip -->
            <div class="lg:w-8/12 p-6 md:p-8 flex flex-col justify-center">
                <div class="flex items-center justify-between mb-4">
                    <h3 class="text-[10px] font-bold text-slate-500 uppercase tracking-[0.2em]">Next 7 Days</h3>
                </div>
                
                <div id="forecast-container" class="flex flex-row overflow-x-auto gap-3 pb-2 custom-scroll scroll-smooth">
                    <!-- Forecast items will be horizontally aligned -->
                </div>

                <div id="error-state" class="hidden text-center py-6">
                    <p class="text-red-400 text-xs mb-3">Sync failed. Check connection.</p>
                    <button onclick="refreshWeather()" class="px-4 py-1.5 bg-sky-500/10 text-sky-400 text-xs border border-sky-500/20 rounded-lg hover:bg-sky-500/20 transition-all">Retry</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const weatherIcons = {
            0: '<svg viewBox="0 0 24 24" fill="none" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-full h-full"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>',
            1: '<svg viewBox="0 0 24 24" fill="none" stroke="#fcd34d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-full h-full"><path d="M12 2v2"></path><path d="m4.93 4.93 1.41 1.41"></path><path d="M20 12h2"></path><path d="m19.07 4.93-1.41 1.41"></path><path d="M15.947 12.65a4 4 0 0 0-5.925-4.128"></path><path d="M13 22H7a5 5 0 1 1 4.9-6H13a3 3 0 0 1 0 6Z"></path></svg>',
            2: '<svg viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-full h-full"><path d="M12 2v2"></path><path d="M20 16.58A5 5 0 0 0 18 7h-1.26A8 8 0 1 0 4 15.25"></path><path d="M8 16a3 3 0 1 0 0 6h10a3 3 0 1 0 0-6Z"></path></svg>',
            3: '<svg viewBox="0 0 24 24" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-full h-full"><path d="M20 16.58A5 5 0 0 0 18 7h-1.26A8 8 0 1 0 4 15.25"></path><path d="M8 16a3 3 0 1 0 0 6h10a3 3 0 1 0 0-6Z"></path></svg>',
            61: '<svg viewBox="0 0 24 24" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-full h-full"><path d="M16 13v8"></path><path d="M8 13v8"></path><path d="M12 15v8"></path><path d="M20 16.58A5 5 0 0 0 18 7h-1.26A8 8 0 1 0 4 15.25"></path></svg>',
            95: '<svg viewBox="0 0 24 24" fill="none" stroke="#facc15" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-full h-full"><path d="M13 2l-2 8h6l-8 12"></path></svg>',
        };

        const WMO_CODES = {
            0: 'Clear', 1: 'Clear', 2: 'Partly Cloudy', 3: 'Overcast',
            45: 'Fog', 51: 'Drizzle', 61: 'Rain', 71: 'Snow',
            80: 'Showers', 95: 'Storm'
        };

        function getIcon(code) {
            if (weatherIcons[code]) return weatherIcons[code];
            if (code >= 51 && code <= 67) return weatherIcons[61];
            if (code >= 80 && code <= 82) return weatherIcons[61];
            return weatherIcons[2];
        }

        async function fetchWeather(lat, lon, cityName = "Your Location") {
            const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m&daily=weather_code,temperature_2m_max,temperature_2m_min,uv_index_max&timezone=auto`;
            
            try {
                const response = await fetch(url);
                const data = await response.json();
                updateUI(data, cityName);
            } catch (error) {
                console.error("API Error:", error);
                document.getElementById('loading-state').classList.add('hidden');
                document.getElementById('error-state').classList.remove('hidden');
            }
        }

        function updateUI(data, cityName) {
            const current = data.current;
            const daily = data.daily;
            
            document.getElementById('city').textContent = cityName;
            
            document.getElementById('temp').textContent = `${Math.round(current.temperature_2m)}°`;
            document.getElementById('condition-text').textContent = WMO_CODES[current.weather_code] || "Clear";
            document.getElementById('current-icon').innerHTML = getIcon(current.weather_code);
            document.getElementById('humidity').textContent = `${current.relative_humidity_2m}%`;
            document.getElementById('wind').textContent = `${Math.round(current.wind_speed_10m)} km/h`;
            document.getElementById('uv').textContent = daily.uv_index_max ? Math.round(daily.uv_index_max[0]) : "0";

            const forecastContainer = document.getElementById('forecast-container');
            forecastContainer.innerHTML = '';

            const todayStr = new Date().toDateString();

            for (let i = 0; i < daily.time.length; i++) {
                const forecastDate = new Date(daily.time[i] + 'T00:00:00');
                if (forecastDate.toDateString() === todayStr) continue;

                const dayShort = forecastDate.toLocaleDateString('en-US', { weekday: 'short' });
                const icon = getIcon(daily.weather_code[i]);
                const max = Math.round(daily.temperature_2m_max[i]);
                const min = Math.round(daily.temperature_2m_min[i]);

                const card = document.createElement('div');
                card.className = 'flex-shrink-0 flex flex-col items-center justify-between p-3 min-w-[85px] rounded-2xl bg-white/5 border border-transparent hover:border-white/10 hover:bg-white/10 transition-all cursor-default';
                card.innerHTML = `
                    <span class="text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-2">${dayShort}</span>
                    <div class="w-8 h-8 my-2 opacity-80">${icon}</div>
                    <div class="flex flex-col items-center mt-1">
                        <span class="text-sm font-bold">${max}°</span>
                        <span class="text-[10px] text-slate-500 font-medium">${min}°</span>
                    </div>
                `;
                forecastContainer.appendChild(card);
                if (forecastContainer.children.length >= 7) break;
            }

            document.getElementById('loading-state').classList.add('hidden');
            document.getElementById('current-weather').classList.remove('hidden');
            document.getElementById('stats-strip').classList.remove('hidden');
            document.getElementById('widget').classList.remove('opacity-0', 'translate-y-4');
        }

        async function reverseGeocode(lat, lon) {
            try {
                const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}`, {
                    headers: { 'Accept-Language': 'en' }
                });
                const data = await res.json();
                return data.address.city || data.address.town || data.address.village || "Nearby";
            } catch { return "Your Location"; }
        }

        function refreshWeather() {
            const widget = document.getElementById('widget');
            widget.classList.add('opacity-0', 'translate-y-2');
            setTimeout(init, 300);
        }

        function setInitialDate() {
            const now = new Date();
            const dateStr = now.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
            const dateEl = document.getElementById('date');
            if (dateEl) dateEl.textContent = dateStr;
        }

        function init() {
            setInitialDate();
            
            document.getElementById('loading-state').classList.remove('hidden');
            document.getElementById('current-weather').classList.add('hidden');
            document.getElementById('stats-strip').classList.add('hidden');
            document.getElementById('error-state').classList.add('hidden');
            document.getElementById('city').textContent = "Locating...";
            
            if ("geolocation" in navigator) {
                navigator.geolocation.getCurrentPosition(
                    async (pos) => {
                        const city = await reverseGeocode(pos.coords.latitude, pos.coords.longitude);
                        fetchWeather(pos.coords.latitude, pos.coords.longitude, city);
                    },
                    (err) => {
                        fetchWeather(40.71, -74.01, "New York");
                    },
                    { timeout: 8000 }
                );
            } else {
                fetchWeather(40.71, -74.01, "New York");
            }
        }

        window.onload = init;
    </script>
</body>
</html>
